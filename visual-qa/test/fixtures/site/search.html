<!doctype html><html><head><meta charset="utf-8"><title>Search</title></head><body>
<h1>Search</h1>
<form id="f"><label for="q">Search</label> <input id="q" name="q" type="search"></form>
<ul id="results"></ul>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  document.getElementById('results').innerHTML = q ? '<li>Espresso — strong Italian coffee</li><li>Espresso machine</li>' : '';
  document.title = 'Results for ' + q;
});
</script></body></html>
