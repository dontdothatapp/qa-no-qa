<!doctype html><html><head><meta charset="utf-8"><title>Shadow</title></head><body>
<h1>Shadow DOM</h1><p id="out">Idle</p><x-widget></x-widget>
<script>
customElements.define('x-widget', class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = '<button>Shadow action</button>';
    root.querySelector('button').addEventListener('click', () => { document.getElementById('out').textContent = 'Clicked'; });
  }
});
</script></body></html>
