<!doctype html><html><head><meta charset="utf-8"><title>Shop</title></head><body>
<h1>Shop</h1><p id="cart">Cart: 0</p>
<article class="card"><h2>Backpack</h2><p>$29.99</p><button class="add" data-item="Backpack">Add to cart</button></article>
<article class="card"><h2>Bolt T-Shirt</h2><p>$15.99</p><button class="add" data-item="Bolt T-Shirt">Add to cart</button></article>
<p id="last"></p>
<script>
let n = 0;
document.querySelectorAll('.add').forEach((b) => b.addEventListener('click', () => {
  n++; document.getElementById('cart').textContent = 'Cart: ' + n;
  document.getElementById('last').textContent = 'Added ' + b.dataset.item;
}));
</script></body></html>
