<!doctype html><html><head><meta charset="utf-8"><title>Upload</title></head><body>
<h1>Upload</h1><label for="file">Attachment</label> <input id="file" type="file"><p id="chosen">No file</p>
<script>document.getElementById('file').addEventListener('change', (e) => { document.getElementById('chosen').textContent = 'Chosen: ' + e.target.files[0].name; });</script>
</body></html>
